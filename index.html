    <!-- Performance: preconnect & dns-prefetch -->

    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Performance: theme pre-paint (避免主题切换闪烁) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('qr-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!--
      旧 hash 路由兼容：本站已由 /#blog/xxx 迁移到 /blog/xxx/。
      已在外部传播或已被搜索引擎记录的旧链接会自动 301 到新地址。
    -->
    <script>
      (function () {
        try {
          var h = (location.hash || '').replace(/^#\/?/, '');
          if (!h) return;
          var path;
          if (h === 'blog' || h === 'blog/') path = '/blog/';
          else if (h.indexOf('blog/') === 0) path = '/blog/' + h.slice(5).split('?')[0] + '/';
          else if (h === 'generator') path = '/#generator';
          else if (h === 'batch') path = '/#batch';
          else if (h === 'faq') path = '/#faq';
          else return;
          if (path.charAt(0) === '/') location.replace(path);
        } catch (e) {}
      })();
    </script>
