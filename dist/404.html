<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found — QR Tool Studio</title>
<style>
  :root{--bg:#ffffff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#6366f1}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0b15;--fg:#f1f5f9;--muted:#94a3b8;--line:#1e293b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--fg);padding:24px}
  .wrap{max-width:640px;text-align:center}
  .code{font-size:72px;font-weight:800;letter-spacing:-2px;color:var(--brand);line-height:1}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:var(--muted);line-height:1.7;margin:0 0 28px}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
  a.btn{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:10px;
        color:var(--fg);text-decoration:none;font-size:14px;font-weight:600;transition:.15s}
  a.btn:hover{border-color:var(--brand);color:var(--brand)}
  .search{display:flex;gap:8px;justify-content:center}
  .search input{flex:1;max-width:360px;padding:10px 14px;border:1px solid var(--line);
                border-radius:10px;background:transparent;color:var(--fg);font-size:14px}
  .search button{padding:10px 18px;border:0;border-radius:10px;background:var(--brand);
                 color:#fff;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be outdated. Try one of these instead — the QR generator runs entirely in your browser, no sign-up needed.</p>

    <nav>
      <a class="btn" href="/">QR Code Generator</a>
      <a class="btn" href="/blog/">Blog</a>
      <a class="btn" href="/about/">About</a>
      <a class="btn" href="/contact/">Contact</a>
    </nav>

    <form class="search" action="https://www.google.com/search" method="get">
      <input type="hidden" name="q" value="site:toolbox168.xyz">
      <input type="text" name="q" placeholder="Search this site…" aria-label="Search">
      <button type="submit">Search</button>
    </form>
  </div>

  <script>
    // 旧 hash 路由兼容：/#blog/xxx -> /blog/xxx/
    (function () {
      try {
        var h = (location.hash || '').replace(/^#\/?/, '');
        if (!h) return;
        if (h === 'blog' || h === 'blog/') return location.replace('/blog/');
        if (h.indexOf('blog/') === 0) return location.replace('/blog/' + h.slice(5).split('?')[0] + '/');
      } catch (e) {}
    })();
  </script>
</body>
</html>
